name: Runner Selection Test
on:
  workflow_dispatch:
    inputs:
      runner_label:
        type: string
  workflow_call:
    inputs:
      runner_label:
        type: string
  push:
    branches: [ main ]
env:
  runner_label: |-
      ${{ case(
        inputs.runner_label != '', inputs.runner_label,
        vars.runner_label != '', vars.runner_label,
        'ubuntu-latest'
      ) }}
jobs:
  use-input-or-var:
    name: Use input or var as rununer
    #runs-on: ${{ inputs.runner_label }}
    runs-on: |-
      ${{ case(
        inputs.runner_label != '', inputs.runner_label,
        vars.runner_label != '', vars.runner_label,
        'ubuntu-latest'
      ) }}
    steps:
      - run: |
          env
          echo "Hello World on runner: ${{ inputs.runner_label }}"
